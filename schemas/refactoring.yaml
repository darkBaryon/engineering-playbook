schema_version: 1
profile: refactoring
levels:
  - 轻量级
  - 标准级
  - 蓝图级
issue_states:
  - 观察中
  - 待计划
  - 执行中
  - 已处理
plan_states:
  - 草拟中
  - 待评审
  - 需修改
  - 已通过
  - 已实施
  - 已归档
required_artifacts_standard:
  - issue
  - plan
  - checklist
  - plan_review
  - implementation_record
  - preflight_facts
  - code_review
  - acceptance_record
gates:
  gate_1: 重构方向与迁移方案放行
  gate_2: 行为与终态验收
